[package]
name = "mesh-thumb"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Headless STL/PLY to PNG thumbnail renderer"
license = "MIT"
readme = "README.md"
keywords = ["stl", "ply", "thumbnail", "renderer", "png"]
categories = ["command-line-utilities", "multimedia::images"]

# The binary name is `mesh-thumb`; the crate is a library core + thin CLI.
[lib]
name = "mesh_thumb"
path = "src/lib.rs"

[[bin]]
name = "mesh-thumb"
path = "src/main.rs"

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = "thin"
codegen-units = 1