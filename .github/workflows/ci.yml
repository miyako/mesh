name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint (deny warnings)
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --release

      - name: Test
        # Golden image tests run in compare mode here: the committed
        # tests/golden/ref/*.png must match current renderer output.
        run: cargo test --all-targets

  # Clippy, tests and benches already covered above; this job validates
  # that the release artifact builds without the dev tooling.
  release:
    name: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup default stable
      - name: Build release binary
        run: cargo build --release --bin mesh-thumb
      - name: Smoke test
        run: |
          ./target/release/mesh-thumb capabilities
          ./target/release/mesh-thumb --help | head -5

  # Phase 6 MeshPreview.Thumbnailer wrapper (spec §22): the in-repo
  # component is validated by its own Python suite (unit, host-contract
  # and release-machinery tests). Runs on macOS: the native CLI cases in
  # test_cli self-skip until cli/asset-lock.json pins a released
  # mesh-thumb, then require the real native host (windows/linux runners
  # cannot verify the pinned universal/PE artifacts).
  component:
    name: component (MeshPreview.Thumbnailer)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pin Python like the component's canonical CI: the macos-latest
      # image's Homebrew python3 (3.15.x) has no PyYAML, and the suite's
      # release-machinery tests (test_workflows) import yaml to parse the
      # checked-in workflow contracts (see AGENTS.md).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned workflow validator dependency
        working-directory: component/MeshPreviewThumbnailer
        run: python3 -m pip install -r tooling/requirements-workflow.txt
      - name: Install verified native CLI (once release pins exist)
        working-directory: component/MeshPreviewThumbnailer
        run: |
          if [ -f cli/asset-lock.json ]; then
            # build_cli.py requires an explicit native target; compute it on
            # the actual runner (macos-latest is arm64).
            TARGET="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from build_cli import native_target; print(native_target())')"
            python3 scripts/build_cli.py --target "$TARGET"
          else
            echo "asset-lock pending; native CLI cases will skip"
          fi
      - name: Wrapper unit and contract suite
        working-directory: component/MeshPreviewThumbnailer
        run: python3 -m unittest discover -s tests