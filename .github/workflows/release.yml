# Release: build binaries for tag pushes (vX.Y.Z) and attach them to a
# GitHub Release. Triggered only by tags matching `v*`.
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0
# The release job then assembles a GitHub Release with per-OS binaries.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        include:
          - os: ubuntu-latest
            bin_suffix: ""
            bin_name: mesh-thumb-linux-x86_64
            artifact: mesh-thumb-linux
          # macos-14 is the arm64 runner; pinned explicitly so the build
          # stays predictable even if `macos-latest` changes architecture.
          # The universal binary is produced by lipo-ing the arm64 and
          # x86_64 slices (x86_64 built via a rustup target on the same
          # runner — no Intel runner needed).
          - os: macos-14
            bin_suffix: ""
            bin_name: mesh-thumb-macos-universal
            artifact: mesh-thumb-macos
          - os: windows-latest
            bin_suffix: ".exe"
            bin_name: mesh-thumb-windows-x86_64.exe
            artifact: mesh-thumb-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Install x86_64 Apple target (macOS universal slice)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary (Linux/Windows native)
        if: runner.os != 'macOS'
        run: cargo build --release --bin mesh-thumb

      - name: Build arm64 slice (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --bin mesh-thumb --target aarch64-apple-darwin

      - name: Build x86_64 slice (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --bin mesh-thumb --target x86_64-apple-darwin

      - name: Stage artifact under its release name
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            lipo -create \
              "target/aarch64-apple-darwin/release/mesh-thumb" \
              "target/x86_64-apple-darwin/release/mesh-thumb" \
              -output "dist/${{ matrix.bin_name }}"
            file "dist/${{ matrix.bin_name }}"
          else
            mv "target/release/mesh-thumb${{ matrix.bin_suffix }}" \
               "dist/${{ matrix.bin_name }}"
          fi

      - name: Smoke test
        shell: bash
        run: |
          BIN="$PWD/dist/${{ matrix.bin_name }}"
          "$BIN" capabilities
          "$BIN" --version
          "$BIN" render fixtures/cube_ascii.stl -o "$PWD/cube.png"
          test -s "$PWD/cube.png"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.bin_name }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Each artifact lands in its own subdirectory (dist/<artifact>/),
      # so the three binaries never collide.
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} + | sed 's|^\./||' > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: mesh-thumb ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*