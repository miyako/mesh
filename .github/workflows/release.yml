# Release: build binaries for tag pushes (vX.Y.Z) and attach them to a
# GitHub Release. Triggered only by tags matching `v*`.
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0
# The release job then assembles a GitHub Release with per-OS binaries.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            bin_suffix: ""
            bin_name: mesh-thumb-linux-x86_64
            artifact: mesh-thumb-linux
          - os: macos-latest
            bin_suffix: ""
            bin_name: mesh-thumb-macos-x86_64
            artifact: mesh-thumb-macos
          - os: windows-latest
            bin_suffix: ".exe"
            bin_name: mesh-thumb-windows-x86_64.exe
            artifact: mesh-thumb-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --bin mesh-thumb

      - name: Smoke test
        shell: bash
        run: |
          BIN="$PWD/target/release/mesh-thumb${{ matrix.bin_suffix }}"
          "$BIN" capabilities
          "$BIN" --version
          "$BIN" render fixtures/cube_ascii.stl -o /tmp/cube.png
          test -s /tmp/cube.png

      - name: Stage artifact under its release name
        shell: bash
        run: |
          mkdir -p dist
          mv "target/release/mesh-thumb${{ matrix.bin_suffix }}" \
             "dist/${{ matrix.bin_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.bin_name }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Each artifact lands in its own subdirectory (dist/<artifact>/),
      # so the three binaries never collide.
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: mesh-thumb ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*