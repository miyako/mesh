# Release: build binaries for tag pushes (vX.Y.Z) and attach them to a
# GitHub Release. Triggered only by tags matching `v*`.
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0
# The release job then assembles a GitHub Release with per-OS binaries.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual trigger: lets you exercise the release build from the Actions
  # UI on any ref (e.g. main) before tagging. The release *page* is still
  # created only for tag runs (the publish step is gated on the ref).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            bin_suffix: ""
            bin_name: mesh-thumb-linux-x86_64
            artifact: mesh-thumb-linux
            package_target: ""
          # macos-latest currently = macOS arm64. Host arch does not
          # matter here: both slices are `--target`-explicit cross-builds
          # (.cargo builds aarch64/x86_64 on any macOS host), and the
          # universal binary is lipo'd from them. We deliberately avoid
          # pinning a concrete major (e.g. macos-14): pinned majors get
          # decommissioned and their jobs are cancelled with no runner
          # (observed twice on macos-14), while `macos-latest` always
          # points at a supported arm64 major.
          - os: macos-latest
            bin_suffix: ""
            bin_name: mesh-thumb-macos-universal
            artifact: mesh-thumb-macos
            package_target: universal-apple-darwin
            python_cmd: python3
          - os: windows-latest
            bin_suffix: ".exe"
            bin_name: mesh-thumb-windows-x86_64.exe
            artifact: mesh-thumb-windows
            package_target: x86_64-pc-windows-msvc
            python_cmd: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to match scripts/package.py's rustc assertion and the
        # documented local toolchain; ZIP packaging refuses other compilers.
        run: rustup default 1.100.0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install x86_64 Apple target (macOS universal slice)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary (Linux/Windows native)
        if: runner.os != 'macOS'
        run: cargo build --release --bin mesh-thumb

      - name: Build arm64 slice (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --bin mesh-thumb --target aarch64-apple-darwin

      - name: Build x86_64 slice (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --bin mesh-thumb --target x86_64-apple-darwin

      - name: Stage artifact under its release name
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            lipo -create \
              "target/aarch64-apple-darwin/release/mesh-thumb" \
              "target/x86_64-apple-darwin/release/mesh-thumb" \
              -output "dist/${{ matrix.bin_name }}"
            file "dist/${{ matrix.bin_name }}"
          else
            mv "target/release/mesh-thumb${{ matrix.bin_suffix }}" \
               "dist/${{ matrix.bin_name }}"
          fi

      - name: Smoke test
        shell: bash
        run: |
          BIN="$PWD/dist/${{ matrix.bin_name }}"
          "$BIN" capabilities
          "$BIN" --version
          "$BIN" render fixtures/cube_ascii.stl -o "$PWD/cube.png"
          test -s "$PWD/cube.png"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.bin_name }}
          if-no-files-found: error

      # Deterministic release ZIPs (quickdraw-cli asset model): the whole
      # archive is what the 4D component pins via cli/asset-lock.json.
      - name: Package deterministic release ZIP
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.python_cmd }}" scripts/package.py \
            --binary "dist/${{ matrix.bin_name }}" \
            --target "${{ matrix.package_target }}" \
            --output dist/zips

      - name: Verify packaged ZIP
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$("${{ matrix.python_cmd }}" -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          "${{ matrix.python_cmd }}" scripts/verify_asset.py \
            "dist/zips/mesh-thumb-v${VERSION}-${{ matrix.package_target }}.zip" \
            --target "${{ matrix.package_target }}" \
            --sha256 "$(awk '{print $1}' "dist/zips/mesh-thumb-v${VERSION}-${{ matrix.package_target }}.zip.sha256")"

      - name: Upload release ZIP and sidecars
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-zips
          path: dist/zips/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Each artifact lands in its own subdirectory (dist/<artifact>/),
      # so the three binaries never collide.
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} + | sed 's|^\./||' > checksums.txt
          cat checksums.txt

      - name: Assert tag matches Cargo version
        # Tag runs only; package.py already refuses to build mismatched
        # binaries, this blocks a release page for a stale tag.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi

      - name: Create Release
        # Tag runs only: a manual dispatch from a branch must not create
        # a "mesh-thumb main" release page; it just builds + uploads.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: mesh-thumb ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*